name: Build APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: |
          Build mode:
            release         — GitHub release only (APKs also go to @entinyGramCI)
            release+tg      — GitHub release + post to @entinyGram main channel
        required: false
        default: release
        type: choice
        options:
          - release
          - release+tg
      prerelease:
        description: 'Mark as a pre-release build (CI-channel-only, creates a GitHub pre-release, adds a "‼️ PRE RELEASE" banner to both)'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ARTIFACT_NAME: entinygram-${{ github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. BUILD ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      apk-arm64:      ${{ steps.info.outputs.apk-arm64 }}
      ver-name:       ${{ steps.info.outputs.ver-name }}
      ver-code:       ${{ steps.info.outputs.ver-code }}
      app-ver-code:   ${{ steps.info.outputs.app-ver-code }}
      day-counter:    ${{ steps.info.outputs.day-counter }}
      date:           ${{ steps.info.outputs.date }}
      tag:            ${{ steps.info.outputs.tag }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email ci@entinygram
          git config --global user.name 'entinygram ci'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@e42e6681d2906409c5dde4a315af6214eaa890ee # v1.2
        with:
          append-timestamp: true
          key: ${{ runner.os }}-ndk-27.2-release
          restore-keys: |
            ${{ runner.os }}-ndk-27.2-release
            ${{ runner.os }}-
          max-size: 5G
          verbose: 2
          save: true

      - name: Set up worktree
        run: bun run setup -- --no-stgit

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret missing"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > worktree/TMessagesProj/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > worktree/TMessagesProj_App/google-services.json

      - name: Compute build info
        id: info
        env:
          INU_DAY_STATE: ${{ vars.INU_DAY_STATE || '' }}
        run: bun run tsx scripts/ci/version.ts

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-home-cache-cleanup: true

      - name: Cache Android NDK & CMake
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.10.2.4988404
          key: android-ndk-cmake-27.2.12479018-3.10.2.4988404

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: >-
            platforms;android-35
            build-tools;35.0.0
            cmake;3.10.2.4988404
            ndk;27.2.12479018

      - name: Tune Gradle
        run: |
          echo 'org.gradle.caching=true'                                              >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true'                                             >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose'                                   >> ~/.gradle/gradle.properties

      - name: Reset ccache stats
        run: ccache -z

      - name: Build arm64-v8a
        working-directory: worktree
        env:
          COMMIT_ID: ${{ github.sha }}
          INU_BUILD: ${{ steps.info.outputs.ver-code }}
          INU_BUILD_TYPE: ${{ inputs.prerelease == 'true' && 'beta' || 'release' }}
          ABI_FILTERS: arm64-v8a
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}/worktree
        run: |
          # Pre-release builds compile the debug buildType instead -- it carries the ".beta"
          # applicationId suffix, so it installs side-by-side with the main app instead of
          # overwriting it (still signed with the same release keystore, see build.gradle).
          if [ '${{ inputs.prerelease }}' = 'true' ]; then
            ./gradlew --no-daemon :TMessagesProj_App:assembleDebug
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp TMessagesProj_App/build/outputs/apk/debug/app.apk "$GITHUB_WORKSPACE/out/${{ steps.info.outputs.apk-arm64 }}"
          else
            ./gradlew --no-daemon :TMessagesProj_App:assembleRelease
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp TMessagesProj_App/build/outputs/apk/release/app.apk "$GITHUB_WORKSPACE/out/${{ steps.info.outputs.apk-arm64 }}"
          fi

      - name: Show ccache stats
        if: always()
        run: ccache -s -v

      - name: Stage artifacts
        env:
          LAST_UPLOADED_SHA: ${{ vars.LAST_RELEASE_SHA }}
        run: |
          mkdir -p out
          apk='${{ steps.info.outputs.apk-arm64 }}'
          apk_files_json=$(jq -cn --arg f "$apk" '[{file:$f}]')

          base="$LAST_UPLOADED_SHA"
          if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::last uploaded sha $base not in history, falling back"
            base=
          fi
          commits_json=$(bun run tsx scripts/ci/get-commits.ts "$base" "$GITHUB_SHA")

          jq -n \
            --arg     verName      '${{ steps.info.outputs.ver-name }}'      \
            --argjson verCode      '${{ steps.info.outputs.ver-code }}'      \
            --argjson appVerCode   '${{ steps.info.outputs.app-ver-code }}'  \
            --arg     buildDate    '${{ steps.info.outputs.date }}'          \
            --argjson apkFiles     "$apk_files_json"                        \
            --arg     commitSha    "$GITHUB_SHA"                            \
            --argjson commits      "$commits_json"                          \
            --arg     repo         "$GITHUB_REPOSITORY"                     \
            '{verName:$verName,verCode:$verCode,appVerCode:$appVerCode,buildDate:$buildDate,apkFiles:$apkFiles,commitSha:$commitSha,commits:$commits,repo:$repo}' \
            > out/build-info.json

      - name: Generate release notes
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:    ${{ vars.GEMINI_MODEL }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
        run: bun run tsx scripts/release-notes.ts out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-unsigned
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # ── 2. SIGN ─────────────────────────────────────────────────────────────────
  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: signing
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: read

    steps:
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;35.0.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: entinygram-${{ github.sha }}-unsigned
          path: out

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Sign APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          apksigner=$ANDROID_HOME/build-tools/35.0.0/apksigner
          apk='${{ needs.build.outputs.apk-arm64 }}'
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-type PKCS12 \
            --ks-key-alias mrtv \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --in  "out/$apk" \
            --out "out/$apk.signed"
          "$apksigner" verify --print-certs "out/$apk.signed"
          mv "out/$apk.signed" "out/$apk"

      - name: Wipe keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Attest signed APKs
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: out/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: entinygram-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # ── 3. UPLOAD ───────────────────────────────────────────────────────────────
  upload:
    name: Upload
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: entinygram-${{ github.sha }}
          path: out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_RELEASE: ${{ inputs.prerelease }}
        run: |
          tag='${{ needs.build.outputs.tag }}'
          apk="out/${{ needs.build.outputs.apk-arm64 }}"

          # Use AI-generated English notes for GitHub (full markdown); guard against null
          notes_en=''
          if [ -f "out/release-notes.json" ]; then
            notes_en=$(jq -r '.en // empty' out/release-notes.json)
          fi
          if [ -n "$notes_en" ]; then
            printf '%s' "$notes_en" > release_body.md
          else
            printf 'Release %s\n' "$tag" > release_body.md
          fi

          # Pre-releases compile the .beta-suffixed debug buildType (see the build job above) --
          # installs as a separate app alongside the main one, doesn't update it. Call that out on
          # the release page too, same as the Telegram CI channel post (scripts/ci/upload.ts).
          # GitHub renders "> [!WARNING]" as a colored admonition box, not just a quoted line.
          if [ "$PRE_RELEASE" = 'true' ]; then
            {
              printf '> [!WARNING]\n'
              printf '> **Pre-release build** — a test build for fixing reported bugs. Expect instability.\n'
              printf '>\n'
              printf '> Installs as a **separate app** (different package name) alongside your main entinyGram install — it will **not** update it.\n'
              printf '\n'
              cat release_body.md
            } > release_body.tmp.md
            mv release_body.tmp.md release_body.md
          fi

          # Append compare link using the previous release tag. GitHub only auto-marks
          # non-prerelease releases as "latest", so this list naturally still reflects the last
          # real release even once pre-releases start showing up in it.
          prev_tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$prev_tag" ] && [ "$prev_tag" != "$tag" ]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev_tag" "$tag" >> release_body.md
          fi

          flags=()
          if [ "$PRE_RELEASE" = 'true' ]; then
            flags+=(--prerelease)
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title  "$tag" \
            --notes-file release_body.md \
            "${flags[@]}" \
            "$apk" || \
          gh release upload "$tag" \
            --clobber \
            "$apk"

      - name: Upload to Telegram (CI channel + optional main channel)
        env:
          TELEGRAM_API_ID:       ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:     ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MAIN_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TELEGRAM_CI_CHANNEL:   ${{ vars.TELEGRAM_CI_CHANNEL || vars.TELEGRAM_CHANNEL }}
          MTPROTO_SESSION:       ${{ secrets.MTPROTO_SESSION }}
          GH_VARS_TOKEN:         ${{ secrets.GH_VARS_TOKEN }}
          PRE_RELEASE:           ${{ inputs.prerelease }}
        run: |
          # Always upload to CI channel.
          # Only post to main channel when mode is "release+tg" -- and never for a pre-release,
          # even if release+tg was selected alongside it by mistake; pre-releases are test builds
          # for the CI channel only.
          if [ '${{ inputs.mode }}' = 'release+tg' ] && [ '${{ inputs.prerelease }}' != 'true' ]; then
            bun run tsx scripts/ci/upload.ts out
          else
            bun run tsx scripts/ci/upload.ts out --ci-only
          fi

      - name: Bump build variables
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INU_VARS_TOKEN }}
        run: |
          next_day_counter=$((${{ needs.build.outputs.day-counter }} + 1))
          gh variable set INU_DAY_STATE --body "${{ needs.build.outputs.date }}:$next_day_counter"
          # Pre-releases don't advance the changelog base -- so once the fixes they were testing
          # actually ship in a normal release, its changelog spans everything since the last real
          # release (including all commits that only ever went out in pre-release test builds),
          # instead of silently dropping them because a pre-release "used them up" already.
          if [ '${{ inputs.prerelease }}' != 'true' ]; then
            gh variable set LAST_RELEASE_SHA --body "$GITHUB_SHA"
          fi
